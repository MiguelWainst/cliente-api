<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			min-height: 100vh;
			background: linear-gradient(135deg, #06162f 0%, #0d274f 50%, #123a73 100%);
		}

		.login-card {
			max-width: 420px;
			border: 0;
			border-radius: 1.25rem;
			overflow: hidden;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
		}

		.login-header {
			background: #0b1f3a;
			color: #fff;
		}

		.form-control:focus {
			border-color: #0d6efd;
			box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
		}

		.btn-login {
			background: #0b1f3a;
			border-color: #0b1f3a;
		}

		.btn-login:hover {
			background: #123a73;
			border-color: #123a73;
		}
	</style>
</head>
<body class="d-flex align-items-center justify-content-center px-3">
	<div class="card login-card w-100">
		<div class="login-header text-center py-4 px-3">
			<h1 class="h4 mb-1">Acessar sistema</h1>
			<p class="mb-0 small text-white-50">Entre com suas credenciais</p>
		</div>

		<div class="card-body p-4 p-md-5 bg-white">
			<form action="/login" method="post" th:action="@{/login}">
				<div class="mb-3">
					<label for="username" class="form-label fw-semibold text-primary">Login</label>
					<input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Digite seu login" required>
				</div>

				<div class="mb-4">
					<label for="password" class="form-label fw-semibold text-primary">Senha</label>
					<input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Digite sua senha" required>
				</div>

				<div class="d-grid">
					<button type="submit" class="btn btn-login btn-lg text-white fw-semibold">Entrar</button>
				</div>
			</form>
		</div>
	</div>

</body>
</html>
